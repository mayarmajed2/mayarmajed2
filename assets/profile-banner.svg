<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Mayar Majed Hussien — Machine Learning, Generative AI &amp; AI Agents">
  <defs>
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080F"/>
      <stop offset="50%" stop-color="#111024"/>
      <stop offset="100%" stop-color="#0A1426"/>
    </linearGradient>

    <radialGradient id="glow-iris" cx="76%" cy="34%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#08080F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-coral" cx="18%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#FB923C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08080F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="85%" cy="78%" r="44%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08080F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="aurora-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D8D"/>
      <stop offset="33%" stop-color="#FB923C"/>
      <stop offset="66%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>

    <linearGradient id="star-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D8D"/>
      <stop offset="48%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <pattern id="micro-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="soft-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg-base)" stroke="#262640" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#micro-grid)"/>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#glow-coral)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#glow-iris)">
    <animate attributeName="opacity" values="1;0.7;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#glow-cyan)"/>

  <!-- Animated Bottom Aurora Waves -->
  <g opacity="0.85">
    <path d="M 2 268 Q 300 238 600 264 T 1198 256 L 1198 296 L 2 296 Z" fill="url(#wave-grad-1)">
      <animate attributeName="d"
        values="M 2 268 Q 300 238 600 264 T 1198 256 L 1198 296 L 2 296 Z;
                M 2 258 Q 300 282 600 252 T 1198 270 L 1198 296 L 2 296 Z;
                M 2 268 Q 300 238 600 264 T 1198 256 L 1198 296 L 2 296 Z"
        dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Top Aurora Accent Bar with Traveling Shimmer -->
  <rect x="24" y="1.5" width="1152" height="2.5" rx="1.25" fill="url(#aurora-line)"/>
  <rect x="24" y="1" width="120" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.75" filter="url(#soft-blur)">
    <animate attributeName="x" values="24;1056;24" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating Ambient Particles Across Canvas -->
  <g>
    <circle cx="480" cy="54" r="2.2" fill="#38BDF8" opacity="0.65">
      <animate attributeName="cy" values="54;36;54" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="480;498;480" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="82" r="2.8" fill="#FF4D8D" opacity="0.6">
      <animate attributeName="cy" values="82;104;82" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="670;652;670" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="215" r="2.4" fill="#FB923C" opacity="0.65">
      <animate attributeName="cy" values="215;192;215" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="168" r="2" fill="#7C5CFF" opacity="0.7">
      <animate attributeName="cy" values="168;148;168" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right Interactive Neural Constellation Hub -->
  <g transform="translate(965, 148)">
    <!-- Outer Rotating Orbit + Orbiting Satellite -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <circle r="114" fill="none" stroke="#7C5CFF" stroke-opacity="0.26" stroke-width="1.2" stroke-dasharray="6 8"/>
      <circle cx="114" cy="0" r="4" fill="#38BDF8"/>
      <circle cx="-114" cy="0" r="3" fill="#FF4D8D"/>
    </g>

    <!-- Middle Counter-Rotating Orbit + Satellite -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="19s" repeatCount="indefinite"/>
      <circle r="84" fill="none" stroke="#38BDF8" stroke-opacity="0.24" stroke-width="1.1" stroke-dasharray="3 6"/>
      <circle cx="0" cy="-84" r="3.2" fill="#FB923C"/>
      <circle cx="0" cy="84" r="3.2" fill="#7C5CFF"/>
    </g>

    <!-- Inner Breathing Halo -->
    <circle r="42" fill="none" stroke="#FF4D8D" stroke-opacity="0.22" stroke-width="1">
      <animate attributeName="r" values="36;52;36" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0.08;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Synaptic Links -->
    <g stroke-width="1.4" stroke-opacity="0.55">
      <line x1="0" y1="0" x2="0" y2="-78" stroke="#38BDF8"/>
      <line x1="0" y1="0" x2="74" y2="-24" stroke="#FF4D8D"/>
      <line x1="0" y1="0" x2="46" y2="64" stroke="#FB923C"/>
      <line x1="0" y1="0" x2="-48" y2="62" stroke="#7C5CFF"/>
      <line x1="0" y1="0" x2="-76" y2="-22" stroke="#38BDF8"/>

      <polygon points="0,-78 74,-24 46,64 -48,62 -76,-22" fill="none" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="-78" x2="46" y2="64" stroke="#7C5CFF" stroke-opacity="0.24"/>
      <line x1="74" y1="-24" x2="-48" y2="62" stroke="#FF4D8D" stroke-opacity="0.24"/>
      <line x1="-76" y1="-22" x2="74" y2="-24" stroke="#38BDF8" stroke-opacity="0.22"/>
    </g>

    <!-- Moving Synaptic Energy Packets Along Filaments -->
    <circle r="3.2" fill="#FFFFFF">
      <animateMotion path="M 0 0 L 0 -78 L 74 -24 L 0 0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#FF4D8D">
      <animateMotion path="M 0 0 L 46 64 L -48 62 L 0 0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#38BDF8">
      <animateMotion path="M 0 0 L -76 -22 L 0 -78 L 0 0" dur="3.9s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Field Nodes -->
    <g>
      <line x1="-76" y1="-22" x2="-142" y2="-62" stroke="#38BDF8" stroke-opacity="0.24" stroke-width="1"/>
      <line x1="-48" y1="62" x2="-162" y2="48" stroke="#FF4D8D" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="74" y1="-24" x2="142" y2="-66" stroke="#FB923C" stroke-opacity="0.24" stroke-width="1"/>
      <line x1="46" y1="64" x2="148" y2="54" stroke="#7C5CFF" stroke-opacity="0.24" stroke-width="1"/>

      <circle cx="-142" cy="-62" r="3.5" fill="#38BDF8">
        <animate attributeName="cy" values="-62;-70;-62" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-162" cy="48" r="3" fill="#FF4D8D">
        <animate attributeName="cy" values="48;56;48" dur="3.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="142" cy="-66" r="3.5" fill="#FB923C">
        <animate attributeName="cy" values="-66;-58;-66" dur="2.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="148" cy="54" r="3" fill="#7C5CFF">
        <animate attributeName="cy" values="54;45;54" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Center Glowing Star Core -->
    <circle r="24" fill="url(#star-core)" opacity="0.34" filter="url(#soft-blur)">
      <animate attributeName="r" values="20;28;20" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#090910" stroke="url(#star-core)" stroke-width="2.5"/>
    <circle r="5" fill="#FFFFFF">
      <animate attributeName="r" values="4;6.2;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- 5 Main Constellation Nodes -->
    <circle cx="0" cy="-78" r="7" fill="#38BDF8">
      <animate attributeName="r" values="6;8;6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="-24" r="6.5" fill="#FF4D8D">
      <animate attributeName="r" values="7.5;5.5;7.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="64" r="6.5" fill="#FB923C">
      <animate attributeName="r" values="5.8;7.8;5.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-48" cy="62" r="7" fill="#7C5CFF">
      <animate attributeName="r" values="7.5;5.8;7.5" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-76" cy="-22" r="6" fill="#38BDF8">
      <animate attributeName="r" values="5.5;7.5;5.5" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Eyebrow Welcome Pill -->
  <g transform="translate(56, 46)">
    <rect x="0" y="0" width="298" height="30" rx="15" fill="#131326" stroke="#2F2F52" stroke-width="1"/>
    <circle cx="17" cy="15" r="5" fill="#10B981" opacity="0.3">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="17" cy="15" r="4" fill="#10B981"/>
    <text x="31" y="19.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
      HELLO, I'M MAYAR · CAIRO, EGYPT
    </text>
  </g>

  <!-- Main Display Name -->
  <text x="56" y="132" fill="url(#name-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="45" font-weight="800" letter-spacing="-0.8">
    Mayar Majed Hussien
  </text>

  <!-- Subtitle -->
  <text x="56" y="168" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
    Machine Learning Engineer · Deep Learning · Generative AI · AI Agents
  </text>

  <!-- Animated Interest Chips -->
  <g transform="translate(56, 204)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="154" height="36" rx="10" fill="#131325" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="16" cy="18" r="4" fill="#38BDF8">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="22.5" fill="#F8FAFC">Machine Learning</text>

    <rect x="166" y="0" width="166" height="36" rx="10" fill="#131325" stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.85;0.35;0.85" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="182" cy="18" r="4" fill="#7C5CFF">
      <animate attributeName="r" values="4.6;3.2;4.6" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="194" y="22.5" fill="#F8FAFC">Deep Learning &amp; CV</text>

    <rect x="344" y="0" width="134" height="36" rx="10" fill="#131325" stroke="#FF4D8D" stroke-opacity="0.55" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <circle cx="360" cy="18" r="4" fill="#FF4D8D">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <text x="372" y="22.5" fill="#F8FAFC">Generative AI</text>

    <rect x="490" y="0" width="116" height="36" rx="10" fill="#131325" stroke="#FB923C" stroke-opacity="0.55" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.9;0.35;0.9" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="506" cy="18" r="4" fill="#FB923C">
      <animate attributeName="r" values="4.6;3.2;4.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="518" y="22.5" fill="#F8FAFC">AI Agents</text>
  </g>
</svg>
