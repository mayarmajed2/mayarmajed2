<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" role="img" aria-label="Senior AI Architecture Flow — Representation Learning, Computer Vision, Multimodal Diffusion, and Autonomous Agent Systems">
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090910"/>
      <stop offset="50%" stop-color="#111022"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>

    <linearGradient id="track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#7C5CFF"/>
      <stop offset="70%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="168" rx="16" fill="url(#pipe-bg)" stroke="#23233A" stroke-width="1.3"/>

  <!-- Connecting Pipeline Track -->
  <path id="flow-track" d="M 165 85 L 455 85 L 745 85 L 1035 85" fill="none" stroke="url(#track-grad)" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Moving Glowing Signals Along the Pipeline -->
  <circle r="5" fill="#38BDF8">
    <animateMotion path="M 165 85 L 1035 85" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#FF4D8D">
    <animateMotion path="M 165 85 L 1035 85" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#FB923C">
    <animateMotion path="M 165 85 L 1035 85" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- NODE 1: Feature & Signal Engineering -->
  <g transform="translate(45, 32)">
    <rect x="0" y="0" width="240" height="106" rx="14" fill="#121223" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="26" cy="28" r="10" fill="#38BDF8" fill-opacity="0.18"/>
    <circle cx="26" cy="28" r="4.5" fill="#38BDF8">
      <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="32" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.2" font-weight="700">01 · REPRESENTATION</text>
    <text x="18" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.2" font-weight="700">Statistical ML &amp; Features</text>
    <text x="18" y="83" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.8">Scikit-learn · K-Means · Feature Eng.</text>
  </g>

  <!-- NODE 2: Deep Learning & Vision -->
  <g transform="translate(335, 32)">
    <rect x="0" y="0" width="240" height="106" rx="14" fill="#121223" stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="26" cy="28" r="10" fill="#7C5CFF" fill-opacity="0.18"/>
    <circle cx="26" cy="28" r="4.5" fill="#7C5CFF">
      <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="32" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.2" font-weight="700">02 · VISION &amp; DL</text>
    <text x="18" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.2" font-weight="700">Neural Vision Backbones</text>
    <text x="18" y="83" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.8">PyTorch · ViT · CNNs · OpenCV</text>
  </g>

  <!-- NODE 3: Multimodal & Diffusion -->
  <g transform="translate(625, 32)">
    <rect x="0" y="0" width="240" height="106" rx="14" fill="#121223" stroke="#FF4D8D" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="26" cy="28" r="10" fill="#FF4D8D" fill-opacity="0.18"/>
    <circle cx="26" cy="28" r="4.5" fill="#FF4D8D">
      <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="32" fill="#F472B6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.2" font-weight="700">03 · MULTIMODAL AI</text>
    <text x="18" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.2" font-weight="700">Diffusion &amp; Vision-Language</text>
    <text x="18" y="83" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.8">Stable Diffusion · BLIP · RoBERTa</text>
  </g>

  <!-- NODE 4: Autonomous Agents & Inference -->
  <g transform="translate(915, 32)">
    <rect x="0" y="0" width="240" height="106" rx="14" fill="#121223" stroke="#FB923C" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="26" cy="28" r="10" fill="#FB923C" fill-opacity="0.18"/>
    <circle cx="26" cy="28" r="4.5" fill="#FB923C">
      <animate attributeName="r" values="3.8;5.8;3.8" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="32" fill="#FB923C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.2" font-weight="700">04 · AGENTIC SYSTEMS</text>
    <text x="18" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.2" font-weight="700">LLM &amp; Multi-Agent Serving</text>
    <text x="18" y="83" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.8">Llama 3 70B · FastMCP · Inference</text>
  </g>
</svg>
