<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 115" width="100%" role="img" aria-label="Building Intelligent AI Systems · Cairo, Egypt">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090910"/>
      <stop offset="50%" stop-color="#131126"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>

    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="28%" stop-color="#7C5CFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF4D8D" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#FB923C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="footer-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#FF4D8D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="113" rx="14" fill="url(#footer-bg)" stroke="#23233A" stroke-width="1.2"/>
  <rect x="60" y="1" width="1080" height="2" rx="1" fill="url(#footer-line)"/>

  <!-- Animated Bottom Wave -->
  <path d="M 2 92 Q 300 72 600 92 T 1198 88 L 1198 113 L 2 113 Z" fill="url(#footer-wave)">
    <animate attributeName="d"
      values="M 2 92 Q 300 72 600 92 T 1198 88 L 1198 113 L 2 113 Z;
              M 2 84 Q 300 104 600 82 T 1198 96 L 1198 113 L 2 113 Z;
              M 2 92 Q 300 72 600 92 T 1198 88 L 1198 113 L 2 113 Z"
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Left Animated Constellation -->
  <line x1="72" y1="56" x2="128" y2="42" stroke="#7C5CFF" stroke-opacity="0.38" stroke-width="1.2"/>
  <line x1="128" y1="42" x2="178" y2="68" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="72" cy="56" r="4" fill="#FF4D8D">
    <animate attributeName="cy" values="56;48;56" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="42" r="3.5" fill="#7C5CFF">
    <animate attributeName="cy" values="42;50;42" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="178" cy="68" r="4" fill="#38BDF8">
    <animate attributeName="cy" values="68;58;68" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Right Animated Constellation -->
  <line x1="1022" y1="68" x2="1072" y2="42" stroke="#FB923C" stroke-opacity="0.35" stroke-width="1.2"/>
  <line x1="1072" y1="42" x2="1128" y2="56" stroke="#FF4D8D" stroke-opacity="0.38" stroke-width="1.2"/>
  <circle cx="1022" cy="68" r="4" fill="#FB923C">
    <animate attributeName="cy" values="68;58;68" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1072" cy="42" r="3.5" fill="#7C5CFF">
    <animate attributeName="cy" values="42;50;42" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1128" cy="56" r="4" fill="#38BDF8">
    <animate attributeName="cy" values="56;48;56" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Centered Tagline -->
  <text x="600" y="50" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">
    Thanks for stopping by · Always curious, always building
  </text>
  <text x="600" y="75" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.4">
    MACHINE LEARNING · DEEP LEARNING · GENERATIVE AI · AI AGENTS · CAIRO, EGYPT
  </text>
</svg>
