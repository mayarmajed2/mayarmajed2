<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 48" width="338" height="48" role="img" aria-label="Computer Vision &amp; Image Processing Icons">
  <!-- Tile 1: OpenCV Tri-Ring -->
  <g transform="translate(0, 0)">
    <rect width="48" height="48" rx="11" fill="#161822" stroke="#2A2D3E" stroke-width="1"/>
    <circle cx="24" cy="14" r="6" fill="none" stroke="#FF4D8D" stroke-width="3.2" stroke-dasharray="28 10" transform="rotate(60 24 14)"/>
    <circle cx="15" cy="30" r="6" fill="none" stroke="#10B981" stroke-width="3.2" stroke-dasharray="28 10" transform="rotate(-40 15 30)"/>
    <circle cx="33" cy="30" r="6" fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-dasharray="28 10" transform="rotate(140 33 30)"/>
  </g>

  <!-- Tile 2: Vision Transformer (ViT Patch Grid + Attention) -->
  <g transform="translate(58, 0)">
    <rect width="48" height="48" rx="11" fill="#161822" stroke="#2A2D3E" stroke-width="1"/>
    <rect x="11" y="11" width="11" height="11" rx="2.5" fill="#7C5CFF" opacity="0.9"/>
    <rect x="26" y="11" width="11" height="11" rx="2.5" fill="#38BDF8" opacity="0.85"/>
    <rect x="11" y="26" width="11" height="11" rx="2.5" fill="#FB923C" opacity="0.85"/>
    <rect x="26" y="26" width="11" height="11" rx="2.5" fill="#FF4D8D" opacity="0.9"/>
    <line x1="16.5" y1="16.5" x2="31.5" y2="31.5" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.85"/>
    <line x1="31.5" y1="16.5" x2="16.5" y2="31.5" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.85"/>
  </g>

  <!-- Tile 3: CNN Feature Map Stack -->
  <g transform="translate(116, 0)">
    <rect width="48" height="48" rx="11" fill="#161822" stroke="#2A2D3E" stroke-width="1"/>
    <rect x="10" y="16" width="18" height="18" rx="3" fill="#1E1B4B" stroke="#7C5CFF" stroke-width="1.8"/>
    <rect x="15" y="13" width="18" height="18" rx="3" fill="#172554" stroke="#38BDF8" stroke-width="1.8"/>
    <rect x="20" y="10" width="18" height="18" rx="3" fill="#3B0764" stroke="#FF4D8D" stroke-width="1.8"/>
    <circle cx="29" cy="19" r="3" fill="#F8FAFC"/>
  </g>

  <!-- Tile 4: Face & Object Detection Bounding Reticle -->
  <g transform="translate(174, 0)">
    <rect width="48" height="48" rx="11" fill="#161822" stroke="#2A2D3E" stroke-width="1"/>
    <path d="M12 18 V12 H18 M30 12 H36 V18 M36 30 V36 H30 M18 36 H12 V30" fill="none" stroke="#FB923C" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="24" cy="21" r="4.5" fill="none" stroke="#F8FAFC" stroke-width="1.8"/>
    <path d="M17 32 C17 28, 31 28, 31 32" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Tile 5: K-Means Color Palette Quantization -->
  <g transform="translate(232, 0)">
    <rect width="48" height="48" rx="11" fill="#161822" stroke="#2A2D3E" stroke-width="1"/>
    <circle cx="17" cy="18" r="6.5" fill="#FF4D8D"/>
    <circle cx="31" cy="18" r="6.5" fill="#38BDF8"/>
    <circle cx="17" cy="31" r="6.5" fill="#FB923C"/>
    <circle cx="31" cy="31" r="6.5" fill="#10B981"/>
    <circle cx="24" cy="24.5" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Tile 6: Spatial Heatmap Analytics -->
  <g transform="translate(290, 0)">
    <rect width="48" height="48" rx="11" fill="#161822" stroke="#2A2D3E" stroke-width="1"/>
    <circle cx="24" cy="24" r="14" fill="#7C5CFF" opacity="0.45"/>
    <circle cx="23" cy="24" r="10" fill="#FF4D8D" opacity="0.7"/>
    <circle cx="22" cy="23" r="6" fill="#FB923C" opacity="0.9"/>
    <circle cx="22" cy="23" r="2.8" fill="#FEF08A"/>
  </g>
</svg>
